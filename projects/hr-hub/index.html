<style>

  --bad: #ff8a80; --bad-soft: #3d1d1c; --chip: #1c2d44; color-scheme: dark } }

  --accent: #5aa6e6; --accent-soft: #16304b; --good: #6fcf97; --good-soft: #17352a; --warn: #f2c14e; --warn-soft: #3a3013;

.big { font: 700 38px/1 var(--font-display); font-variant-numeric: tabular-nums }

.owner { font: 500 11px var(--font-mono); color: var(--muted); min-width: 84px; flex: none }
.tabs { display: flex; flex-wrap: wrap; gap: 6px } .tabs button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 999px; background: var(--chip); font-weight: 600; font-size: 12.5px; color: var(--muted) }

.chk { width: 16px; height: 16px; accent-color: var(--good); cursor: pointer }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--navy); color: var(--navy-ink); padding: 10px 14px; border-radius: 8px; font-weight: 500; z-index: 20; max-width: calc(100vw - 32px) }
.status { font-size: 12.5px; color: var(--muted) }
.lockrow td { color: var(--muted) }
pre.copy { white-space: pre-wrap; background: var(--chip); padding: 10px 12px; border-radius: 6px; font: 13px/1.5 var(--font-body); margin: 0 }
.linkbtn { all: unset; cursor: pointer; color: var(--accent); font-weight: 600; text-decoration: underline; margin-left: 6px } .linkbtn:focus-visible { outline: 2px solid var(--accent) }
.dropzone { display: grid; gap: 4px; border: 2px dashed var(--line); border-radius: 8px; padding: 14px 16px; cursor: pointer; background: var(--panel); text-align: center }
.dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--accent-soft) }
.dropzone:focus-within { outline: 2px solid var(--accent); outline-offset: 2px }

@media (max-width: 880px) {
  .shell { grid-template-columns: minmax(0,1fr) }
  nav.rail { flex-direction: row; overflow-x: auto; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)) }
  .brand, .rail .group { display: none } .rail button { white-space: nowrap; flex: none }
  .g4 { grid-template-columns: repeat(2, minmax(0,1fr)) } .g2, .g3, .g21 { grid-template-columns: minmax(0,1fr) } .typepick { grid-template-columns: minmax(0,1fr) }
}
.acct { float: right; display: inline-flex; gap: 8px; align-items: center }

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(() => {
const S = { view: "dashboard", admin: false, canWrite: null, db: null, user: null, downloads: null, uid: null,
  people: [], tasks: [], messages: [], feedback: [], fbArea: null, openDraft: null, rules: [], questions: [], fields: [], departments: [], interviews: [], paper: [], settings: { reviewDays: 90, locations: [] },
  loaded: {}, personId: null, proc: "Onboarding", ruleTab: "Hiring", owner: null, form: null, confirm: null, saving: false };
const EVENTS = { Hire: "Hiring", Transfer: "Transfer", Departure: "Termination" };
const KIND_LABEL = { auto: "Automate later", docusign: "DocuSign", record: "In the Hub", routed: "Owner task", manual: "HR", draft: "Draft to send", filing: "Filing" };
const KIND_CLASS = { auto: "warn", docusign: "acc", record: "good", routed: "", manual: "", draft: "acc", filing: "" };
const DESTS = [["payroll", "Payroll list"], ["supervisor", "Supervisor roster"], ["safety", "Drivers & safety"], ["directory", "Company directory"], ["innergy", "Innergy import"]];
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + Number(n || 0)); return d.toISOString().slice(0, 10); };
const fmt = iso => { if (!iso) return ""; const d = new Date(iso.slice(0, 10) + "T12:00:00"); return d.toLocaleDateString(undefined, { weekday: "short", month: "numeric", day: "numeric" }); };
const daysFrom = iso => Math.round((new Date(iso + "T12:00:00") - new Date(today() + "T12:00:00")) / 864e5);
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "x";
const rid = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function toast(msg) { document.querySelectorAll(".toast").forEach(x => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

// ---------- rules engine ----------
function evalRule(rule, ans) {
  if (!rule || /^always$/i.test(rule.trim())) return true;
  return rule.split(/\s+AND\s+/i).every(part => {
    const m = part.match(/^\s*([a-z_]+)\s*=\s*(.+?)\s*$/i); if (!m) return true;
    const v = ans[m[1]], want = m[2].toLowerCase();
    if (want === "yes") return v === true; if (want === "no") return v !== true;
    return String(v ?? "").toLowerCase() === want;
  });
}
function answersFor(f) {
  const a = Object.assign({}, f.answers);
  const dep = S.departments.find(d => d.name === f.department);
  a.confidential_dept = !!(dep && dep.confidential);
  return a;
}
function plan(f) {
  const ck = EVENTS[f.type], a = answersFor(f);
  const rules = S.rules.filter(r => r.checklist === ck && r.active !== false).sort((x, y) => x.order - y.order);
  const on = rules.filter(r => evalRule(r.rule, a));
  return { on, skipped: rules.length - on.length, answers: a };
}

// ---------- data ----------
function render() {
  document.querySelectorAll("[data-admin]").forEach(el => { el.hidden = !S.admin; });
  if (!S.admin && S.view !== "mytasks") S.view = "mytasks";
  document.querySelectorAll(".rail button").forEach(b => b.setAttribute("aria-current", b.dataset.v === S.view ? "page" : "false"));
  const over = S.tasks.filter(t => t.status !== "Done" && t.due && t.due < today()).length;
  const c = $("#c-over"); c.hidden = !over; c.textContent = over;
  const nf = S.feedback.filter(f => (f.status || "New") === "New").length, cf = $("#c-fb"); if (cf) { cf.hidden = !nf; cf.textContent = nf; }
  const focus = document.activeElement && document.activeElement.id;
  const main = $("#main");
  const html = (S.admin && S.loaded.rules && !S.rules.length && S.view !== "feedback") ? setupView() : (VIEWS[S.view] || VIEWS.dashboard)();
  main.innerHTML = `<div class="view">${html}</div>`;
  if (focus) { const el = document.getElementById(focus); if (el) { el.focus(); } }
}
function subscribe(name, coll) {
  const q = S.db.collection(coll);
  q.onSnapshot(snap => {
    S[name] = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    if (!snap.metadata.fromCache) S.loaded[name] = true;
    if (name === "settingsList") { const m = S.settingsList.find(x => x.id === "main"); if (m) S.settings = m; }
    scheduleRender();
  }, err => { S.loaded[name] = true; scheduleRender(); });
}
let rq = null; function scheduleRender() { if (rq) return; rq = requestAnimationFrame(() => { rq = null; if (!isTyping()) render(); else pending = true; }); }
let pending = false;
function isTyping() { const a = document.activeElement; return a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "checkbox") || a.tagName === "SELECT"); }
document.addEventListener("focusout", () => setTimeout(() => { if (pending && !isTyping()) { pending = false; render(); } }, 0));

async function write(path, data, kind = "set") {
  try { const ref = S.db.doc(path); await (kind === "update" ? ref.update(data) : ref.set(data)); return true; }
  catch (e) { toast(e && (e.code === "invalid_argument" || e.code === "not_granted") ? "You don't have permission to change this." : e && e.code === "too_large" ? "That's too large to save." : "Couldn't save. Try again."); return false; }
}
async function remove(path) { try { await S.db.doc(path).delete(); return true; } catch (e) { toast("Couldn't delete. Try again."); return false; } }
async function inSeries(items, fn, n = 4) { let i = 0; const run = async () => { while (i < items.length) { const k = i++; await fn(items[k]); } }; await Promise.all(Array.from({ length: n }, run)); }

// ---------- derived ----------
const tasksOf = pid => S.tasks.filter(t => t.personId === pid);
function progress(pid) { const ts = tasksOf(pid); const done = ts.filter(t => t.status === "Done").length; const over = ts.filter(t => t.status !== "Done" && t.due && t.due < today()).length; return { done, total: ts.length, over }; }
function personStatus(p) {
  const pr = progress(p.id);
  if (p.closed) return ["Closed", ""];
  if (pr.total && pr.done === pr.total) return ["Complete", "good"];
  if (pr.over) return [`Overdue · ${pr.over}`, "bad"];
  const d = daysFrom(p.date); if (d <= 2 && d >= 0) return [d === 0 ? "Today" : "Due soon", "warn"];
  return [d > 7 ? "Starting soon" : "On track", d > 7 ? "" : "good"];
}
function fieldValue(p, key) {
  const cap = tasksOf(p.id).filter(t => t.captures === key && t.answer).map(t => t.answer);
  if (cap.length) return cap.join("; ");
  switch (key) {
    case "start_date": return p.type !== "Departure" ? p.date : "";
    case "last_day": return p.type === "Departure" ? p.date : "";
    case "drives": return p.answers && p.answers.drives ? "Yes" : "No";
    case "badged": return p.answers && p.answers.badged ? "Yes" : "No";
    case "review_due": return p.type === "Hire" ? addDays(p.date, S.settings.reviewDays || 90) : "";
    default: return p[key] ?? "";
  }
}
function folderName(p) { const n = (p.legal_name || "").replace(/^Sample:\s*/, "").trim(); const parts = n.split(/\s+/); const last = parts.length > 1 ? parts.pop() : n; const nm = parts.length ? `${last}, ${parts.join(" ")}` : last; return p.emp_no ? `${nm} (${p.emp_no})` : nm; }
function i9Retention(p) { if (p.type !== "Departure") return ""; const plus = (iso, y) => { const d = new Date(iso + "T12:00:00"); d.setFullYear(d.getFullYear() + y); return d.toISOString().slice(0, 10); };
  const a = plus(p.date, 1); if (!p.hire_date) return a + " (add hire date to confirm)"; const b = plus(p.hire_date, 3); return a > b ? a : b; }
function fillTemplate(text, p) {
  return String(text || "").replace(/\{(\w+)\}/g, (_, k) => ({ name: (p.legal_name || "").replace(/^Sample:\s*/, ""), preferred_name: (p.preferred_name || p.legal_name || "").replace(/^Sample:\s*/, ""), title: p.title, department: p.department, date: fmt(p.date), manager: p.manager || "their manager",
    folder_name: folderName(p), year: (p.date || "").slice(0, 4), last_year: (p.date || "").slice(0, 4), i9_retention: i9Retention(p), hire_date: p.hire_date ? fmt(p.hire_date) : "" }[k] ?? ""));
}
const MESSAGES = {
  Hire: [["New hire announcement", "Welcome {preferred_name}!", "Please welcome {preferred_name}, who joins our {department} team as {title} on {date}. Say hello when you see them!"],
         ["Safety orientation request", "Safety orientation: {name}", "{name} starts {date} as {title} in {department}. Please schedule safety orientation before day 1."]],
  Transfer: [["Promotion announcement", "Congratulations, {preferred_name}", "{preferred_name} moves into the role of {title} in {department} starting {date}."]],
  Departure: [["TeamLogic lockout", "Account lockout: {name}", "Please lock {name}'s Windows, email and server accounts at the end of the day on {date}. Please set an auto-reply; email forwarding per {manager}."],
              ["Departure notice (key employees)", "{name}", "{name}'s last day with Concepts is {date}. Please route {department} questions to {manager}."]],
};

// ---------- views ----------
const VIEWS = {
  dashboard() {
    if (!S.loaded.people && !S.loaded.tasks) return `<div class="empty">Loading…</div>`;
    const P = PROCS[S.proc] || PROCS.Onboarding;
    const allActive = S.people.filter(p => !p.closed);
    const active = allActive.filter(p => p.type === P.type);
    const ids = new Set(active.map(p => p.id));
    const open = S.tasks.filter(t => t.status !== "Done" && ids.has(t.personId));
    const overdue = open.filter(t => t.due && t.due < today()).sort((a, b) => a.due.localeCompare(b.due));
    const hrSoon = open.filter(t => ["manual", "auto", "draft", "filing"].includes(t.kind) && t.owner === "HR" && t.due && daysFrom(t.due) <= 7).sort((a, b) => a.due.localeCompare(b.due));
    const soon = active.filter(p => daysFrom(p.date) >= 0 && daysFrom(p.date) <= 14).length;
    const examples = S.people.some(p => p.example);
    const dateline = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    if (!allActive.length) return `<div class="head"><div><div class="eyebrow">${dateline}</div><h1>HR Hub</h1></div></div>
      <div class="panel empty stack"><h2>No one in progress yet</h2><p class="muted" style="margin:0">Start a hire, transfer or departure and the Hub builds the checklist from your rules. Or load sample people to try it first.</p>
      <div class="row" style="justify-content:center"><button class="btn" data-go="start">Start a hire or departure</button><button class="btn ghost" data-act="samples">Load sample people</button></div></div>`;
    let special = "", risk = "";
    if (P.type === "Hire") {
      const unsigned = open.filter(t => t.kind === "docusign").length;
      special = `<div class="panel tile ${unsigned ? "" : ""}"><div class="n">${unsigned}</div><div class="l">DocuSign documents not yet signed</div></div>`;
      const atRisk = open.filter(t => t.kind === "docusign" && active.some(p => p.id === t.personId && daysFrom(p.date) <= 2));
      if (atRisk.length) risk = `<div class="panel stack" style="border-color:var(--warn)"><h2>Paperwork not signed, starting within 2 days</h2><ul class="list">${atRisk.slice(0, 8).map(t => `<li><span class="owner">${esc(t.personName)}</span><span>${esc(t.step)}</span></li>`).join("")}</ul></div>`;
    } else if (P.type === "Departure") {
      const deadline = open.filter(t => t.due && daysFrom(t.due) <= 1).sort((a, b) => a.due.localeCompare(b.due));
      special = `<div class="panel tile ${deadline.length ? "alert" : ""}"><div class="n">${deadline.length}</div><div class="l">Due by tomorrow (access, keys, final pay)</div></div>`;
      if (deadline.length) risk = `<div class="panel stack" style="border-color:var(--bad)"><h2>Deadline risk: must be done by the day after the last day</h2><ul class="list">${deadline.slice(0, 10).map(t => `<li><span class="owner">${esc(t.owner)}</span><span>${esc(t.personName)}: ${esc(t.step)} <span class="muted">(${t.due < today() ? "overdue since " : "due "}${fmt(t.due)})</span></span></li>`).join("")}</ul></div>`;
    } else {
      const routed = open.filter(t => t.kind === "routed").length;
      special = `<div class="panel tile"><div class="n">${routed}</div><div class="l">Payroll and owner updates open</div></div>`;
    }
    return `<div class="head"><div><div class="eyebrow">${dateline}</div><h1>HR Hub</h1><p class="lead">${P.lead}</p></div>
      <div class="row">${examples ? `<button class="btn ghost" data-act="clearsamples">Remove sample people</button>` : ""}<button class="btn" data-go="start" data-newtype="${P.type}">+ ${P.newLabel}</button></div></div>
    ${procTabs()}
    <div class="grid g4">
      <div class="panel tile"><div class="n">${soon}</div><div class="l">${P.soonLabel}</div></div>
      ${special}
      <div class="panel tile ${overdue.length ? "alert" : ""}"><div class="n">${overdue.length}</div><div class="l">Tasks overdue</div></div>
      <div class="panel tile"><div class="n">${hrSoon.length}</div><div class="l">HR tasks due this week</div></div>
    </div>
    ${risk}
    <div class="panel"><h2 style="margin-bottom:8px">${P.title} in progress</h2>${active.length ? `<div class="tablewrap"><table><thead><tr><th>Person</th><th>Role</th><th>Department</th><th>${P.dateHead}</th><th>Tasks done</th><th>Status</th></tr></thead><tbody>
      ${active.slice().sort((a, b) => a.date.localeCompare(b.date)).map(p => { const pr = progress(p.id), st = personStatus(p);
        return `<tr class="click" data-person="${esc(p.id)}" tabindex="0"><td><b>${esc(p.legal_name)}</b>${p.example ? ` <span class="pill">Sample</span>` : ""}</td><td>${esc(p.title)}</td><td>${esc(p.department)}</td><td class="mono">${fmt(p.date)}</td>
        <td><div class="row" style="flex-wrap:nowrap"><div class="bar ${pr.over ? "bad" : ""}"><i style="width:${pr.total ? Math.round(pr.done / pr.total * 100) : 0}%"></i></div><span class="mono">${pr.done}/${pr.total}</span></div></td><td><span class="pill ${st[1]}">${st[0]}</span></td></tr>`; }).join("")}
    </tbody></table></div>` : `<p class="muted small" style="margin:0">No ${P.title.toLowerCase()} in progress.</p>`}</div>
    <div class="grid g2">
      <div class="panel stack"><h2>Overdue</h2>${overdue.length ? `<ul class="list">${overdue.slice(0, 8).map(t => `<li><span class="owner">${esc(t.owner)}</span><span>${esc(t.personName)}: ${esc(t.step)} <span class="muted">(due ${fmt(t.due)})</span></span></li>`).join("")}</ul>` : `<p class="muted small" style="margin:0">Nothing overdue.</p>`}</div>
      <div class="panel stack"><h2>Yours this week</h2>${hrSoon.length ? `<ul class="list">${hrSoon.slice(0, 8).map(t => `<li><span class="owner">${fmt(t.due)}</span><span>${esc(t.personName)}: ${esc(t.step)}</span></li>`).join("")}</ul>` : `<p class="muted small" style="margin:0">Nothing due this week.</p>`}</div>
    </div>`;
  },

  start() {
    if (!S.form) S.form = { type: "Hire", legal_name: "", preferred_name: "", emp_no: "", title: "", department: (S.departments.slice().sort((x, y) => x.order - y.order)[0] || {}).name || "", location: "", manager: "", work_email: "", date: addDays(today(), 7), answers: { state: "CO" } };
    const f = S.form, pl = plan(f);
    const qs = S.questions.filter(q => q.active !== false && q.type !== "derived" && (q.events || []).includes(f.type)).sort((a, b) => a.order - b.order);
    const docs = pl.on.filter(r => r.kind === "docusign"), tasks = pl.on.filter(r => r.kind !== "docusign");
    const owners = [...new Set(tasks.map(t => t.owner))];
    const dateLabel = f.type === "Departure" ? "Last day" : f.type === "Transfer" ? "Effective date" : "Start date";
    return `<div class="head"><div><div class="eyebrow">About 2 minutes</div><h1>Start a hire, transfer or departure</h1><p class="lead">Answer the questions once. Only the steps that apply to this person are created, from your checklist rules.</p></div></div>
    ${S.formNote ? `<div class="note" style="background:var(--accent-soft);color:var(--ink)">${esc(S.formNote)} <button class="btn ghost small" data-act="clearform">Start blank instead</button></div>` : dropZone("startfile", "Already have this person's details in the people file?")}
    <form id="startform" class="grid g21" autocomplete="off">
      <div class="panel stack">
        <div class="typepick" role="group" aria-label="What's happening">${["Hire", "Transfer", "Departure"].map(t => `<button type="button" data-type="${t}" aria-pressed="${f.type === t}">${t === "Transfer" ? "Promotion / transfer" : t}</button>`).join("")}</div>
        <div class="grid g2">
          ${inputF("legal_name", "Legal name", f.legal_name, true)}${inputF("preferred_name", "Preferred name", f.preferred_name)}
          ${inputF("title", f.type === "Departure" ? "Job title" : "Job title (new)", f.title, true)}
          <div class="field"><label for="f-department">Department</label><select id="f-department" data-f="department">${S.departments.slice().sort((a, b) => a.order - b.order).map(d => `<option ${d.name === f.department ? "selected" : ""}>${esc(d.name)}</option>`).join("")}</select></div>
          <div class="field"><label for="f-location">Work location</label><input id="f-location" type="text" list="locs" data-f="location" value="${esc(f.location)}"><datalist id="locs">${(S.settings.locations || []).map(l => `<option value="${esc(l)}">`).join("")}</datalist></div>
          ${inputF("manager", "Manager", f.manager)}${inputF("emp_no", "Employee number", f.emp_no)}${inputF("work_email", "Work email (if known)", f.work_email)}
          ${f.type === "Departure" ? `<div class="field"><label for="f-hire_date">Original hire date</label><input id="f-hire_date" type="date" data-f="hire_date" value="${esc(f.hire_date || "")}"></div>` : ""}
          <div class="field"><label for="f-date">${dateLabel}</label><input id="f-date" type="date" data-f="date" value="${esc(f.date)}" required></div>
        </div>
        <div>${qs.map(q => q.type === "choice"
          ? `<div class="q"><label class="t" for="q-${q.key}">${esc(q.label)}</label><select id="q-${q.key}" data-q="${q.key}" style="width:auto">${q.options.map(o => `<option ${f.answers[q.key] === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`
          : `<div class="q"><span class="t">${esc(q.label)}</span><div class="seg" role="group" aria-label="${esc(q.label)}"><button type="button" data-yn="${q.key}" data-val="1" aria-pressed="${f.answers[q.key] === true}">Yes</button><button type="button" data-yn="${q.key}" data-val="0" aria-pressed="${f.answers[q.key] !== true}">No</button></div></div>`).join("")}
          <div class="q"><span class="t">Confidentiality agreement</span><span class="pill ${pl.answers.confidential_dept ? "acc" : ""}">${pl.answers.confidential_dept ? "Required (department)" : "Not required"}</span></div></div>
        <div class="row"><button class="btn" type="submit" ${S.saving ? "disabled" : ""}>${S.saving ? "Creating…" : "Create checklist"}</button><span class="small muted" id="formmsg"></span></div>
      </div>
      <div class="panel stack" aria-live="polite">
        <h2>What this creates</h2>
        <div class="grid g2"><div><div class="big">${tasks.length}</div><div class="small muted">tasks for ${owners.length} owners</div></div><div><div class="big">${docs.length}</div><div class="small muted">documents for the DocuSign envelope</div></div></div>
        <div class="small"><b>${pl.skipped}</b> steps skipped because they don't apply.</div>
        ${docs.length ? `<div><div class="eyebrow" style="color:var(--muted)">DocuSign envelope</div><ul class="list" style="margin-top:6px">${docs.map(d => `<li><span class="owner">${d.rule === "Always" ? "all" : "rule"}</span><span>${esc(d.step)}</span></li>`).join("")}</ul></div>` : ""}
        <div><div class="eyebrow" style="color:var(--muted)">Tasks by owner</div><ul class="list" style="margin-top:6px">${owners.map(o => `<li><span class="owner">${esc(o)}</span><span>${tasks.filter(t => t.owner === o).length} task${tasks.filter(t => t.owner === o).length > 1 ? "s" : ""}</span></li>`).join("")}</ul></div>
      </div>
    </form>`;
  },

  feedback() {
    const AREAS = ["Dashboard", "Start a checklist", "People file", "Person record", "My tasks", "Checklist rules", "Messages and drafts", "Who sees what", "Exports", "Interviews", "Paper inbox", "Something else"];
    const area = S.fbArea || "Dashboard";
    const list = S.feedback.slice().sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
    const ST = { New: "acc", Planned: "warn", Done: "good", "Won't do": "" };
    return `<div class="head"><div><div class="eyebrow">For the pilot only</div><h1>Feedback</h1><p class="lead">Tell us what works, what's confusing, and what's missing. Only you and the BYU team can see this tab. It won't be part of the final build.</p></div></div>
    <div class="grid g21">
      <div class="stack">${list.length ? list.map(f => `<div class="panel stack"><div class="row" style="justify-content:space-between"><div class="row"><span class="pill ${ST[f.status || "New"]}">${esc(f.status || "New")}</span><span class="pill">${esc(f.kind)}</span><span class="small muted">${esc(f.area)} · ${f.createdAt ? new Date(f.createdAt).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : ""}${f.importance ? " · " + esc(f.importance) : ""}</span></div>
          <select data-fbstatus="${esc(f.id)}" aria-label="Status" style="width:auto">${Object.keys(ST).map(k => `<option ${(f.status || "New") === k ? "selected" : ""}>${k}</option>`).join("")}</select></div>
        <div style="white-space:pre-wrap">${esc(f.text)}</div>
        ${f.reply ? `<div class="note"><b>BYU team:</b> ${esc(f.reply)}</div>` : ""}
        <div class="row"><input type="text" id="fbr-${esc(f.id)}" placeholder="Reply from the BYU team" value="${esc(f.reply || "")}" style="flex:1;min-width:180px"><button class="btn ghost small" data-fbreply="${esc(f.id)}">Save reply</button><button class="btn ghost small" data-fbdel="${esc(f.id)}">Delete</button></div></div>`).join("")
        : `<div class="panel empty">No feedback yet. Use the form to add the first note.</div>`}</div>
      <form id="fbform" class="panel stack"><h2>Add feedback</h2>
        <div class="field"><label for="fb-area">Which part?</label><select id="fb-area">${AREAS.map(a => `<option ${a === area ? "selected" : ""}>${a}</option>`).join("")}</select></div>
        <div class="field"><span style="font-weight:600;font-size:13px">What kind?</span><div class="seg" role="group" aria-label="Kind">${["Idea", "Problem", "Question", "Works well"].map((k, i) => `<button type="button" data-fbkind="${k}" aria-pressed="${(S.fbKind || "Idea") === k}">${k}</button>`).join("")}</div></div>
        <div class="field"><label for="fb-imp">How important?</label><select id="fb-imp"><option>Nice to have</option><option>Important</option><option>Must have before go-live</option></select></div>
        <div class="field"><label for="fb-text">Your feedback</label><textarea id="fb-text" rows="6" required placeholder="What happened, what you expected, or what you'd like it to do"></textarea></div>
        <button class="btn" type="submit">Send feedback</button>
        <p class="small muted" style="margin:0">Please leave out employee personal details.</p></form>
    </div>`;
  },

  import() {
    const rows = S.importRows || [];
    if (!rows.length) return `<div class="empty">Nothing to import. <button class="btn ghost small" data-go="people">Back to People</button></div>`;
    const n = rows.filter(r => r.include).length;
    return `<div class="head"><div><div class="eyebrow">From ${esc(S.importFile || "file")}</div><h1>Review before creating</h1><p class="lead">Each row becomes a checklist built from your rules. Untick any row you don't want, or open one in the start form to check it first.</p></div></div>
    <div class="panel"><div class="tablewrap"><table><thead><tr><th>Create</th><th>Event</th><th>Name</th><th>Job title</th><th>Department</th><th>Date</th><th>Steps</th><th>Notes</th><th></th></tr></thead><tbody>
    ${rows.map((r, i) => { const f = r.form; return `<tr><td><input class="chk" type="checkbox" data-imp="${i}" ${r.include ? "checked" : ""} aria-label="Create ${esc(f.legal_name)}"></td><td>${esc(f.type)}</td><td><b>${esc(f.legal_name)}</b></td><td>${esc(f.title) || `<span class="pill bad">Missing</span>`}</td><td>${esc(f.department)}</td><td class="mono">${fmt(f.date)}</td><td class="mono">${plan(f).on.length}</td><td class="small muted">${esc(r.warnings.join("; "))}</td><td><button class="btn ghost small" data-imprev="${i}">Open in form</button></td></tr>`; }).join("")}
    </tbody></table></div></div>
    <div class="row"><button class="btn" data-act="importall" ${n && !S.saving ? "" : "disabled"}>${S.saving ? `Creating ${S.importDone || 0} of ${n}…` : `Create ${n} checklist${n === 1 ? "" : "s"}`}</button><button class="btn ghost" data-act="cancelimport">Cancel</button></div>`;
  },

  people() {
    const P = PROCS[S.proc] || PROCS.Onboarding;
    const list = S.people.filter(p => p.type === P.type).sort((a, b) => (a.closed - b.closed) || b.date.localeCompare(a.date));
    return `<div class="head"><div><div class="eyebrow">HR only</div><h1>People</h1><p class="lead">Everyone the Hub has a checklist for. Close a record when everything is done.</p></div><button class="btn" data-go="start" data-newtype="${P.type}">+ ${P.newLabel}</button></div>
    <div class="grid g2"><div class="panel stack"><h2>People file</h2><p class="small muted" style="margin:0">Everyone's details, already filled in. Download everyone here, or one person with the Download button on their row. Change the event and date, then drop the file back in.</p>
      <div class="row"><button class="btn small" data-act="dlpeople">Download people file (${latestPerPerson().length})</button><button class="btn ghost small" data-act="dlblank">Download blank file</button></div></div>
      <div class="stack">${dropZone("peoplefile", "Drop in a people file to start checklists")}</div></div>
    ${procTabs()}
    <div class="panel">${list.length ? `<div class="tablewrap"><table><thead><tr><th>Person</th><th>Department</th><th>${P.dateHead}</th><th>Tasks</th><th>Status</th><th>File</th></tr></thead><tbody>
    ${list.map(p => { const pr = progress(p.id), st = personStatus(p); return `<tr class="click" data-person="${esc(p.id)}" tabindex="0"><td><b>${esc(p.legal_name)}</b>${p.example ? ` <span class="pill">Sample</span>` : ""}</td><td>${esc(p.department)}</td><td class="mono">${fmt(p.date)}</td><td class="mono">${pr.done}/${pr.total}</td><td><span class="pill ${st[1]}">${st[0]}</span></td><td><button class="btn ghost small" data-dl1="${esc(p.id)}" aria-label="Download ${esc(p.legal_name)}'s file">Download</button></td></tr>`; }).join("")}
    </tbody></table></div>` : `<div class="empty">No ${P.title.toLowerCase()} yet.</div>`}</div>`;
  },

  person() {
    const p = S.people.find(x => x.id === S.personId);
    if (!p) return `<div class="empty">This record isn't available. <button class="btn ghost small" data-go="people">Back to People</button></div>`;
    const ts = tasksOf(p.id).sort((a, b) => (a.due || "").localeCompare(b.due || ""));
    const docs = ts.filter(t => t.kind === "docusign"), rest = ts.filter(t => t.kind !== "docusign");
    const pr = progress(p.id), st = personStatus(p);
    const stored = S.fields.filter(f => f.stored).sort((a, b) => a.order - b.order);
    return `<div class="row"><button class="btn ghost small" data-go="people">← People</button></div>
    <div class="head"><div><div class="eyebrow">${esc(p.type)} · ${esc(p.department)}</div><h1>${esc(p.legal_name)}</h1><p class="lead">${esc(p.title)} · ${p.type === "Departure" ? "last day" : p.type === "Transfer" ? "effective" : "starts"} ${fmt(p.date)} · ${pr.done} of ${pr.total} steps done</p></div>
      <div class="row"><span class="pill ${st[1]}">${st[0]}</span>${p.closed ? `<button class="btn ghost small" data-act="reopen">Reopen</button>` : `<button class="btn ghost small" data-act="close">Close record</button>`}${p.type !== "Departure" ? `<button class="btn ghost small" data-act="fromperson" data-ftype="Transfer">Start a transfer</button><button class="btn ghost small" data-act="fromperson" data-ftype="Departure">Start a departure</button>` : ""}<button class="btn ghost small" data-dl1="${esc(p.id)}">Download file</button><button class="btn ghost small" data-act="askdelete">Delete</button></div></div>
    ${S.confirm === p.id ? `<div class="confirm"><span>Delete ${esc(p.legal_name)} and all ${ts.length} tasks? This can't be undone.</span><button class="btn danger small" data-act="delete">Delete</button><button class="btn ghost small" data-act="canceldelete">Keep</button></div>` : ""}
    <div class="grid g21">
      <div class="stack">
        ${docs.length ? `<div class="panel stack"><div class="row" style="justify-content:space-between"><h2>DocuSign envelope · ${docs.filter(d => d.status === "Done").length}/${docs.length} signed</h2>${docs.some(d => d.status !== "Done") ? `<button class="btn small" data-act="envelope">Mark all signed</button>` : ""}</div>
          <p class="small muted" style="margin:0">Send one envelope containing these documents. Tick each as it comes back, or all at once.</p>
          ${docs.map(t => taskRow(t)).join("")}</div>` : ""}
        <div class="panel stack"><h2>Checklist</h2>${rest.map(t => taskRow(t, true)).join("") || `<p class="muted">No tasks.</p>`}</div>
      </div>
      <div class="stack">
        <div class="panel stack"><h2>Record</h2><div class="tablewrap"><table><tbody>
          ${stored.map(f => `<tr><td class="muted small">${esc(f.label)}</td><td>${esc(fieldValue(p, f.key)) || `<span class="muted">·</span>`}</td></tr>`).join("")}
          ${p.type === "Departure" ? `<tr><td class="muted small">Original hire date</td><td>${p.hire_date ? fmt(p.hire_date) : `<span class="muted">·</span>`}</td></tr><tr><td class="muted small">Keep I-9 until</td><td>${esc(i9Retention(p))}</td></tr>` : ""}
          <tr class="lockrow"><td class="small">Pay, SSN, address, benefits</td><td class="small">Kept in payroll and Ease</td></tr></tbody></table></div>
          <button class="btn ghost small" data-act="edit">Edit details</button></div>
        ${S.editing === p.id ? `<div class="panel stack"><h2>Edit details</h2>${["legal_name", "preferred_name", "title", "location", "manager", "emp_no", "work_email"].map(k => `<div class="field"><label for="e-${k}">${esc((S.fields.find(f => f.key === k) || { label: k }).label)}</label><input id="e-${k}" type="text" value="${esc(p[k] || "")}"></div>`).join("")}
          ${p.type === "Departure" ? `<div class="field"><label for="e-hire_date">Original hire date</label><input id="e-hire_date" type="date" value="${esc(p.hire_date || "")}"></div>` : ""}
          <div class="row"><button class="btn small" data-act="saveedit">Save</button><button class="btn ghost small" data-act="canceledit">Cancel</button></div></div>` : ""}

      </div>
    </div>`;
  },

  mytasks() {
    const owners = [...new Set(S.rules.map(r => r.owner))].filter(o => !/^(New hire|Employee|Automatic)$/.test(o)).sort();
    if (!S.owner) S.owner = store.get("hrhub-owner") || (S.admin ? "HR" : owners[0]);
    const mine = S.tasks.filter(t => t.owner === S.owner && t.kind !== "docusign" && t.kind !== "record");

async function readPeopleFile(file) {

  if (file.size > 5e6) return toast("That file is too large. Use the HR Hub people file.");
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: true });
    const isNameHeader = h => { const n = normH(h); const k = (BASE_COLS.find(c => normH(c[1]) === n) || [])[0] || ALIASES[n] || (String(h).match(/\[(legal_name)\]/) || [])[1]; return k === "legal_name" || k === "_first" || k === "_last"; };
    let found = null, firstHeaders = [];
    const order = wb.SheetNames.slice().sort((a, b) => (b === "People") - (a === "People"));
    for (const sn of order) {
      const grid = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: "", raw: true, blankrows: false });
      if (!firstHeaders.length && grid.length) firstHeaders = grid[0].filter(Boolean).map(String);
      const hi = grid.slice(0, 10).findIndex(r => r.some(isNameHeader));
      if (hi >= 0) { const head = grid[hi].map(h => String(h).replace(/^\uFEFF/, "").trim()); found = grid.slice(hi + 1).map(r => { const o = {}; head.forEach((h, i) => { if (h) o[h] = r[i] ?? ""; }); return o; }); break; }
    }
    if (!found) return toast(`Couldn't find a name column. The first row needs headers such as "Legal name"${firstHeaders.length ? `; this file starts with: ${firstHeaders.slice(0, 4).join(", ")}` : ""}.`);
    const parsed = found.map(rowToForm);
    const rows = parsed.filter(r => r && !r.example), examples = parsed.filter(r => r && r.example).length;
    if (!rows.length) return toast(examples ? "The file only has the example row. Type a real person over it (remove \"Example:\" from the name), save, and drop it in again." : "Found the column headers but no names in the rows below them. Add at least one person and try again.");
    S.importFile = file.name;
    if (rows.length === 1) { S.form = rows[0].form; S.formNote = `Filled from ${file.name}.${rows[0].warnings.length ? " " + rows[0].warnings.join(". ") + "." : ""} Check everything, then create the checklist.`; S.view = "start"; render(); return; }
    S.importRows = rows; S.view = "import"; render();
  } catch (er) { toast("Couldn't read that file. Save it as .xlsx or .csv and try again."); }
}

// ---------- boot: sign in with Microsoft 365, then load the lists ----------
function bootMessage(title, text, button) {
  $("#main").innerHTML = `<div class="view"><div class="panel empty stack"><h2>${esc(title)}</h2><p class="muted" style="margin:0">${esc(text)}</p>${button ? `<div class="row" style="justify-content:center"><button class="btn" id="bootbtn">${esc(button)}</button></div>` : ""}</div></div>`;
  document.querySelectorAll("[data-admin]").forEach(el => { el.hidden = true; });
}
(async () => {
  let c;
  try { c = await HRM365.connect(); } catch (er) { return bootMessage("The HR Hub couldn't start", (er && er.message) || "Reload the page."); }
  const acct = $("#acct");
  if (c.account && acct) { acct.innerHTML = `<span>${esc(c.account.name)}</span><button class="linkbtn" id="signout">Sign out</button>`; $("#signout").onclick = c.signOut; }
  if (c.state === "not_configured") return bootMessage("Not connected yet", "The HR Hub stores its data in CIM's SharePoint, and it hasn't been connected yet. IT: see setup/SETUP.md in the HR Hub folder.");
  if (c.state === "signed_out") { bootMessage("Sign in to the HR Hub", "Use your Concepts in Millwork Microsoft 365 account.", "Sign in"); $("#bootbtn").onclick = c.signIn; return; }
  if (c.state !== "ready") return bootMessage("The HR Hub couldn't load", c.message || "Reload the page.");
  S.db = c.db; S.user = c.user; S.downloads = c.downloads;
  S.admin = !!(await c.user.canEdit()); S.canWrite = await c.user.can("data.write"); try { S.uid = await c.user.id(); } catch (er) {}
  S.view = S.admin ? "dashboard" : "mytasks";
  const sp = store.get("hrhub-proc"); if (sp && PROCS[sp]) S.proc = sp;
  [["rules", "rules"], ["messages", "messages"], ["questions", "questions"], ["fields", "fields"], ["departments", "departments"], ["settingsList", "settings"], ["tasks", "tasks"]].forEach(([n, cl]) => subscribe(n, cl));
  if (S.admin) [["people", "people"], ["interviews", "interviews"], ["paper", "paper"], ["feedback", "feedback"]].forEach(([n, cl]) => subscribe(n, cl));
  c.start();
  render();
})();
})();
</script>
