<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CIM Job Cost Pilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="vendor/msal-browser.min.js"></script>
<script src="config.js"></script>
<script src="m365.js"></script>
<style>
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface2:#F8F8FA; --ink:#1A1F2E; --body:#3F4656; --muted:#636B7A; --line:#DFE2E8;
  --navy:#1B2550; --navy-ink:#FFFFFF; --navy-soft:#E6E9F3; --amber:#FFF3D9; --amber-line:#E6C27A; --amber-ink:#7A4510;
  --green:#E4F2E9; --green-ink:#25663F; --red-ink:#9B2C2C; --focus:#3B5BDB;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12151C; --surface:#1B1F29; --surface2:#222734; --ink:#ECEEF3; --body:#C7CBD4; --muted:#9AA1AE; --line:#323846;
  --navy:#8FA2E8; --navy-ink:#10131A; --navy-soft:#262D44; --amber:#3A2E17; --amber-line:#7A5E22; --amber-ink:#F2CC85;
  --green:#1C3326; --green-ink:#8FD3A8; --red-ink:#F0A3A3; --focus:#8FA2E8; color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1B1F29; --surface2:#222734; --ink:#ECEEF3; --body:#C7CBD4; --muted:#9AA1AE; --line:#323846;
  --navy:#8FA2E8; --navy-ink:#10131A; --navy-soft:#262D44; --amber:#3A2E17; --amber-line:#7A5E22; --amber-ink:#F2CC85;
  --green:#1C3326; --green-ink:#8FD3A8; --red-ink:#F0A3A3; --focus:#8FA2E8; color-scheme: dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans',Arial,sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--navy)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:12px 20px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 28px}
.brand{display:flex;flex-direction:column;padding-bottom:12px}
.brand b{font:500 20px/1.2 'IBM Plex Serif',Georgia,serif;color:var(--navy)}
.brand span{font-size:13px;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:2px}
nav a{display:inline-block;padding:10px 14px 12px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;font-weight:500}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--navy)}
main{max-width:1280px;margin:0 auto;padding:24px 20px 64px}
h1{font:500 28px/1.2 'IBM Plex Serif',Georgia,serif;margin:0 0 6px;color:var(--ink)}
h2{font-size:17px;margin:0 0 10px}
.lede{margin:0 0 20px;color:var(--body);max-width:72ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;min-height:42px;cursor:pointer;font-weight:500;color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{min-height:34px;padding:5px 10px;font-size:14px}
.note{font-size:13px;color:var(--muted)}
.stat{display:flex;flex-direction:column;padding:0 22px 0 0;margin-right:22px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{font-size:22px;font-weight:600}
.stat span{font-size:13px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:36px 20px;text-align:center;background:var(--surface2);cursor:pointer}
.drop.over{border-color:var(--navy);background:var(--navy-soft)}
.issue{background:var(--amber);border:1px solid var(--amber-line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.issue p{margin:0 0 8px}
.issue b{color:var(--amber-ink)}
.okmsg{background:var(--green);color:var(--green-ink);border-radius:8px;padding:10px 14px;font-weight:500;margin-bottom:12px}
.errmsg{background:var(--amber);color:var(--amber-ink);border-radius:8px;padding:10px 14px;font-weight:500;margin-bottom:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
tr.flag td{background:var(--amber)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--navy-soft);color:var(--navy)}
.chip.ok{background:var(--green);color:var(--green-ink)}
.chip.warn{background:var(--amber);color:var(--amber-ink)}
input.cell{width:100%;min-width:84px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface);text-align:right}
input.cell.text{text-align:left;min-width:120px}
input.inp,select.inp{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--surface);min-height:40px}
details summary{cursor:pointer}
.legs{font-size:13.5px;color:var(--body);margin:6px 0 0}
.legs td{padding:4px 8px;border-bottom:1px dashed var(--line)}
.wip th:first-child,.wip td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.wip th:first-child{background:var(--surface2)}
.grp th{font-size:12px;color:var(--ink);background:var(--surface);text-align:center;border-bottom:2px solid var(--navy)}
.calc{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0;color:var(--navy);text-decoration:underline;cursor:pointer;font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.phone nav{display:none} body.phone main{max-width:520px;padding:16px 14px 48px} body.phone .brand span{display:none}
.leg{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.big{font-size:17px;min-height:52px;width:100%}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 18px}
.role{text-align:left;display:flex;flex-direction:column;gap:4px;padding:16px;min-height:96px;border:1px solid var(--line, #ccc);border-radius:10px;background:var(--panel, transparent);color:inherit;font:inherit;cursor:pointer}
.role:hover,.role:focus-visible{border-color:currentColor}
.role b{font-size:17px}.role span{opacity:.75;font-size:14px}
.steps{list-style:none;padding:0;margin:0}.steps li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line, #ddd)}.steps li:first-child{border-top:0}
.tick{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:13px;opacity:.5}.tick.on{opacity:1;background:#2e7d4f;border-color:#2e7d4f;color:#fff}
.stack{display:flex;flex-direction:column;gap:10px}
.stack label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.stack select,.stack input{font-size:16px;min-height:48px;width:100%}
.acct{margin-left:auto;padding-bottom:12px;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
@media (max-width:640px){ .stat{border-right:0;margin-right:0;width:50%} h1{font-size:23px} }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><b>CIM Job Cost Pilot</b><span>Mileage from timecards, posted to each job&#8217;s WIP</span></div>
  <nav aria-label="Sections" id="nav">
    <a href="#start">Start here</a><a href="#trip">Log a trip</a><a href="#mileage">Mileage</a><a href="#wip">WIP schedule</a><a href="#imports">Imports</a><a href="#setup">Setup</a>
  </nav>
  <div class="acct" id="acct"></div>
</div></header>
<main id="app" aria-live="polite"><p class="note">Loading&#8230;</p></main>
<input type="file" id="impfile" accept=".xlsx,.xls,.csv" class="sr" aria-label="Choose a file to import">
<input type="file" id="file" accept=".xlsx,.xls" class="sr" aria-label="Choose a timecard export">
<script>
const S = { db:null, canWrite:true, loaded:false, loadErr:'', jobs:{}, legs:{}, settings:{rate:0.58,bases:{},lateCut:0.9,lateAmt:1000,jumpPts:15}, mileage:{}, parking:{}, wip:{},
  week:null, approved:{}, msg:'', err:'', sel:null, jobFilter:'', pk:{who:'',job:'',amt:'',date:''}, trips:{}, wkPick:null, imports:{}, lines:{}, closes:{}, reviews:{}, imp:null, impType:'sage_cost', wipFilter:'all', me:'', user:null,
  t:{who:'', date:'', stops:['',''], manual:{}, park:'', photo:null, photoName:'', sent:null, busy:false} };
try { S.t.who = localStorage.getItem('cimInstaller') || ''; } catch(e) {}
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (n < 0 ? '(' : '') + '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + (n < 0 ? ')' : '');
const money0 = n => (n < 0 ? '(' : '') + '$' + Math.round(Math.abs(n)).toLocaleString('en-US') + (n < 0 ? ')' : '');
const num = v => { const x = parseFloat(String(v ?? '').replace(/[$,\s]/g,'')); return isNaN(x) ? null : x; };
const key = (a,b) => [a,b].sort().join('__');
const ymd = d => d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
const mdy = d => (d.getMonth()+1) + '/' + d.getDate() + '/' + d.getFullYear();
const dayName = d => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' + (d.getMonth()+1) + '/' + d.getDate();
const initials = n => String(n).split(/\s+/).map(p => p[0] || '').join('').toUpperCase().slice(0,3);

/* ---------- data store ---------- */
async function initDb(){
  const timer = setTimeout(() => { if (!S.loaded) { S.loadErr = 'Shared data did not load within 10 seconds. You can still load a timecard file, but saved jobs, distances and WIP entries are not available in this view.'; S.loaded = true; render(); } }, 10000);
  let conn;
  try { conn = await JCM365.connect(); } catch(e) { conn = {state:'error', message: (e && e.message) || 'Sign-in failed.'}; }
  S.conn = conn; renderAcct();
  if (conn.state !== 'ready') { clearTimeout(timer); S.loaded = true; S.canWrite = false; S.gate = conn; render(); return; }
  const db = conn.db; S.db = db;
  try { const u = conn.user; if (u) { S.user = u; const c = await u.can('data.write'); if (c === false) S.canWrite = false; S.me = (await u.id()) || ''; } } catch(e) {}
  let pending = 11;
  const done = () => { if (--pending <= 0 && !S.loaded) { clearTimeout(timer); S.loaded = true; } render(); };
  const sub = (name, setter) => db.collection(name).onSnapshot(snap => { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); setter(o); done(); }, e => { S.loadErr = 'Could not read ' + name + ': ' + e.message; done(); });
  sub('jobs', o => S.jobs = o); sub('legs', o => S.legs = o); sub('mileage', o => S.mileage = o); sub('parking', o => S.parking = o); sub('wip', o => S.wip = o); sub('trips', o => S.trips = o); sub('imports', o => { S.imports = o; _costCache = null; }); sub('lines', o => S.lines = o); sub('closes', o => S.closes = o); sub('reviews', o => S.reviews = o);
  db.doc('config/settings').onSnapshot(d => { if (d.exists) S.settings = Object.assign({rate:0.58,bases:{},lateCut:0.9,lateAmt:1000,jumpPts:15}, d.data()); done(); }, e => done());
  conn.start();
}
function renderAcct(){
  const el = $('#acct'), c = S.conn; if (!el || !c || !c.account) return;
  el.innerHTML = '<span>' + esc(c.account.name) + '</span><button class="linkbtn" id="signout">Sign out</button>'; $('#signout').onclick = c.signOut;
}
function viewGate(){
  const g = S.gate;
  if (g.state === 'not_configured') return '<h1>Not connected yet</h1><p class="lede">The Job Cost Pilot stores its jobs, trips and WIP in CIM&#8217;s SharePoint, and it hasn&#8217;t been connected yet. IT: see setup/SETUP.md in the job-cost folder.</p>';
  if (g.state === 'signed_out') return '<h1>Sign in</h1><p class="lede">Use your Concepts in Millwork Microsoft 365 account.</p><button class="btn primary big" style="max-width:320px" data-act="signin">Sign in</button>';
  return '<h1>The pilot couldn&#8217;t load</h1><p class="lede">' + esc(g.message || 'Reload the page.') + '</p>';
}
function setupPanel(){
  const st = S.setupImport;
  return '<div class="panel stack" style="border-color:var(--navy)"><h2 style="margin:0">One-time setup: load the jobs</h2><p class="note" style="margin:0">The Job Cost list in SharePoint is empty. Load the starting setup file (job-cost-setup.json) to add the 83 jobs with their Sage and Innergy numbers and distances, the job-to-job distances, the mileage rate and the installers&#8217; home bases.</p>' +
    (st ? '<p style="margin:0"><b>' + (st.done < st.total ? 'Loading ' + st.done + ' of ' + st.total + '&#8230;' : 'Loaded ' + st.total + ' items.') + '</b>' + (st.failed ? ' ' + st.failed + ' couldn&#8217;t be saved; load the file again to retry them.' : '') + '</p>'
        : '<div class="row"><button class="btn primary" data-act="setupfile">Choose job-cost-setup.json</button><span class="note">The file you were given with this version. It isn&#8217;t stored on the website.</span></div>') + '</div>';
}
async function loadSetup(file){
  let parsed; try { parsed = JSON.parse(await file.text()); } catch(e) { S.err = 'That isn&#8217;t the Job Cost setup file.'; return render(); }
  if (!parsed || parsed.format !== 'job-cost-setup-1' || !parsed.collections) { S.err = 'That isn&#8217;t the Job Cost setup file.'; return render(); }
  const items = []; Object.entries(parsed.collections).forEach(([c, docs]) => Object.entries(docs).forEach(([id, d]) => items.push([c + '/' + docId(id), d])));
  S.setupImport = {total: items.length, done: 0, failed: 0}; render();
  let i = 0; const run = async () => { while (i < items.length) { const [path, d] = items[i++]; try { await S.db.doc(path).set(d); } catch(e) { S.setupImport.failed++; } S.setupImport.done++; render(); } };
  await Promise.all([run(), run(), run()]);
  S.msg = S.setupImport.failed ? 'Some items didn&#8217;t save.' : 'Jobs, distances and settings loaded.'; S.setupImport = null; render();
}
async function save(path, data, merge=true){
  if (!S.db || !S.canWrite) { S.err = 'This view cannot save changes.'; render(); return false; }
  try { const ref = S.db.doc(path); if (merge) { const g = await ref.get(); if (g.exists) await ref.update(data); else await ref.set(data); } else await ref.set(data); return true; }
  catch(e) { if (e.code === 'invalid_argument') S.canWrite = false; S.err = 'Could not save: ' + e.message; render(); return false; }
}
async function del(path){ if (!S.db || !S.canWrite) return; try { await S.db.doc(path).delete(); } catch(e) { S.err = 'Could not delete: ' + e.message; render(); } }
const docId = s => String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_');

/* ---------- job lookups ---------- */
function findJob(n){
  n = String(n||'').trim(); if (!n) return null;
  if (S.jobs[n]) return S.jobs[n];
  for (const id in S.jobs){ const j = S.jobs[id]; if (j.short === n || String(j.alias||'').split(/[,\s]+/).includes(n) || j.proj === n || (j.aka||[]).includes(n.toLowerCase())) return j; }
  return null;
}
const jobName = n => { const j = findJob(n); return j ? (j.iname || j.tname || '') : ''; };
function baseMiles(job, base){ const j = findJob(job); if (!j) return null; const v = base === 'Englewood' ? j.eng : j.cos; return (v === '' || v == null) ? null : Number(v); }
function legMiles(a,b){ if (a === b) return 0; const l = S.legs[key(a,b)]; return l && l.miles !== '' && l.miles != null ? Number(l.miles) : null; }

/* ---------- timecard parsing ---------- */
function parseStart(v){
  if (v instanceof Date) return v;
  if (typeof v === 'number') { const d = XLSX.SSF.parse_date_code(v); return new Date(d.y, d.m-1, d.d, d.H, d.M); }
  const m = String(v||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if (!m) return null; let h = +m[4]; if (m[6]) { if (/pm/i.test(m[6]) && h < 12) h += 12; if (/am/i.test(m[6]) && h === 12) h = 0; }
  return new Date(+m[3], +m[1]-1, +m[2], h, +m[5]);
}
function loadWorkbook(buf, fname){
  let rows;
  try { const wb = XLSX.read(buf, {type:'array', cellDates:true}); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:null, raw:true}); }
  catch(e) { S.err = 'That file could not be read as a spreadsheet. Export Time Tracking from Innergy as .xlsx and try again.'; render(); return; }
  const need = ['Name','Activity Name','Project External Id','WO Number','Start'];
  const cols = rows.length ? Object.keys(rows[0]) : [];
  const missing = need.filter(c => !cols.includes(c));
  if (missing.length) { S.err = 'This file is missing the column' + (missing.length > 1 ? 's ' : ' ') + missing.join(', ') + '. Use Innergy&#8217;s Time Tracking export, the same report as "Time Tracking 10_19_2026".'; render(); return; }
  let who = null; const entries = [];
  for (const r of rows) {
    if (r['Name']) who = String(r['Name']).trim();
    if (!r['Activity Name'] || !who) continue;
    const st = parseStart(r['Start']); if (!st) continue;
    const ext = r['Project External Id']; if (ext == null || ext === '') continue;
    const sage = String(ext).replace(/\.0+$/,'').trim();
    const wo = String(r['WO Number']||''); const proj = (wo.match(/^(P-\d\d-\d{4})/)||[])[1] || '';
    entries.push({who, sage, proj, wo, pname:String(r['Project Name']||''), act:String(r['Activity Name']||''), start:st});
  }
  if (!entries.length) { S.err = 'No job time was found in this file. Check that it covers a pay week with installer time on jobs.'; render(); return; }
  const days = {};
  entries.sort((a,b) => a.start - b.start).forEach(e => { const k = e.who + '|' + ymd(e.start); (days[k] = days[k] || {who:e.who, date:new Date(e.start.getFullYear(), e.start.getMonth(), e.start.getDate()), seq:[]}).seq.push(e); });
  const tcJobs = {};
  entries.forEach(e => { const t = tcJobs[e.sage] = tcJobs[e.sage] || {sage:e.sage, proj:e.proj, pname:e.pname, wos:{}, travelWo:''}; t.wos[e.wo] = 1; if (/travel/i.test(e.act) && !t.travelWo) t.travelWo = e.wo; if (!t.proj) t.proj = e.proj; });
  const list = Object.values(days).map(d => { const stops = []; d.seq.forEach(e => { if (stops[stops.length-1] !== e.sage) stops.push(e.sage); }); return {who:d.who, date:d.date, stops}; })
    .sort((a,b) => a.who.localeCompare(b.who) || a.date - b.date);
  const start = list.reduce((m,d) => d.date < m ? d.date : m, list[0].date);
  S.week = {fname, days:list, tcJobs, start}; S.approved = {}; S.msg = 'Loaded ' + fname + ': ' + list.length + ' installer-days from ' + new Set(list.map(d=>d.who)).size + ' installers.'; S.err = '';
  render();
}

/* ---------- mileage math ---------- */
function computeWeek(){
  if (!S.week) return null;
  const rate = Number(S.settings.rate) || 0;
  const issues = []; const seenIssue = {};
  const addIssue = (k, o) => { if (!seenIssue[k]) { seenIssue[k] = 1; issues.push(o); } };
  const days = S.week.days.map(d => {
    const base = (S.settings.bases||{})[d.who] || '';
    const stops = ['Base', ...d.stops, 'Base']; const legs = []; let problem = false;
    if (!base) { problem = true; addIssue('base|'+d.who, {type:'base', who:d.who}); }
    d.stops.forEach(s => { if (!findJob(s)) { problem = true; addIssue('job|'+s, {type:'job', sage:s, tc:S.week.tcJobs[s]}); } });
    for (let i = 0; i < stops.length - 1; i++) {
      const a = stops[i], b = stops[i+1]; const charge = b !== 'Base' ? b : a;
      let mi = null;
      if (base) {
        if (a === 'Base') { mi = baseMiles(b, base); if (mi == null && findJob(b)) addIssue('bm|'+b+'|'+base, {type:'basemiles', sage:b, base}); }
        else if (b === 'Base') { mi = baseMiles(a, base); if (mi == null && findJob(a)) addIssue('bm|'+a+'|'+base, {type:'basemiles', sage:a, base}); }
        else { mi = legMiles(a, b); if (mi == null) addIssue('leg|'+key(a,b), {type:'leg', a, b}); }
      }
      if (mi == null) problem = true;
      legs.push({a, b, charge, mi, amt: mi == null ? 0 : mi * rate, ext: 'MIL-' + initials(d.who) + '-' + ymd(d.date) + '-' + (i+1) + '-' + charge});

function jobAgg(sage){

function wipRow(sage){
  const w = S.wip[sage] || {}; const j = findJob(sage) || {}; const g = k => num(w[k]);
  const a = jobAgg(sage); const ml = a.ml;
  const base = a.contract != null ? a.contract : g('contract');
  const contract = (base == null && g('co') == null) ? null : (base||0) + (g('co')||0);
  const billed = a.billed != null ? a.billed : g('billed');

  if (lines.some(l => l.hasBudget && l.ctd > l.budget)) flags.push('A line is over budget');

}
function resolveJob(raw){
  const s = String(raw ?? '').trim().replace(/\.0+$/,''); if (!s) return null;

function guessCol(headers, field){
  const H = headers.map(h => String(h ?? '').toLowerCase().trim());
  for (const a of ALIASES[field]) { const i = H.indexOf(a); if (i >= 0) return i; }
  for (const a of ALIASES[field]) { const i = H.findIndex(h => h && h.includes(a)); if (i >= 0) return i; }
  return -1;
}
function loadImport(buf, fname){
  let wb; try { wb = XLSX.read(buf, {type:'array', cellDates:true}); } catch(e) { S.err = 'That file could not be read. Use an .xlsx or .csv export.'; return render(); }
  const names = [...wb.SheetNames].sort((a,b) => (b === 'Sage Lines') - (a === 'Sage Lines'));
  for (const sn of names) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null});
    for (let r = 0; r < Math.min(15, aoa.length); r++) {
      const row = aoa[r] || []; const strs = row.filter(v => typeof v === 'string' && v.trim()).length;
      if (strs >= 2 && guessCol(row, 'job') >= 0 && guessCol(row, 'amount') >= 0) {
        const headers = row.map(v => v == null ? '' : String(v));
        const map = {}; Object.keys(ALIASES).forEach(f => map[f] = guessCol(headers, f));
        if (map.amount === map.line) map.amount = guessCol(headers.map((h,i) => i === map.line ? '' : h), 'amount');
        S.imp = {file:fname, sheet:sn, headers, rows: aoa.slice(r+1).filter(x => x && x.some(v => v != null && v !== '')), map, type:S.impType || 'sage_cost'};
        S.err = ''; return render();

  }

}
function prepImport(){
  const I = S.imp, T = IMPORT_TYPES[I.type], m = I.map; const out = [], skipped = {}, unmatched = {};
  const skip = r => { skipped[r] = (skipped[r]||0) + 1; };
  const prior = new Set(allCosts().map(r => r.k)), inFile = new Set();
  const srcIdx = I.headers.findIndex(h => /^source$/i.test(String(h).trim()));
  const whatIdx = I.headers.findIndex(h => /what happens/i.test(String(h)));
  I.rows.forEach(row => {
    const cell = i => (i == null || i < 0) ? null : row[i];
    const amt = num(cell(m.amount)); if (amt == null || amt === 0) return skip('No amount');
    const cc = String(cell(m.line) ?? '').trim();
    if (T.st === 'sage') {
      if (whatIdx >= 0 && !/send to innergy/i.test(String(cell(whatIdx) ?? ''))) { const w = String(cell(whatIdx) ?? '');
        return skip(/PO/.test(w) ? 'PO invoice: already in Innergy' : /duplicate/i.test(w) ? 'Duplicate export' : /description/i.test(w) ? 'Job only in the description: fix in Sage' : /crosswalk/i.test(w) ? 'Job not in crosswalk' : 'Not a job cost'); }
      if (srcIdx >= 0 && /^PO/i.test(String(cell(srcIdx) ?? ''))) return skip('PO invoice: already in Innergy');
      if (cc === '2-03-01' || cc === '2-03-99') return skip('Mileage or parking: comes from the phone app');
    }
    const rawJob = String(cell(m.job) ?? '').trim(); if (!rawJob) return skip('No job');
    const sage = resolveJob(rawJob); if (!sage) { unmatched[rawJob] = (unmatched[rawJob]||0) + 1; return; }
    const line = T.st === 'sage' ? (ccmap()[cc] || (cc ? 'Unmapped ' + cc : 'Unassigned')) : (cc || (T.kind === 'contract' || T.kind === 'billed' ? '' : 'Unassigned'));
    const dt = cell(m.date); const date = dt instanceof Date ? ymd(dt) : String(dt ?? '');
    const ref = String(cell(m.ref) ?? ''), vendor = String(cell(m.vendor) ?? ''), desc = String(cell(m.desc) ?? '');
    const k = [T.kind, sage, cc, ref, date, desc, amt.toFixed(2)].join('|');
    if (inFile.has(k)) return skip('Duplicate in this file'); inFile.add(k);
    if (prior.has(k)) return skip('Already imported earlier');
    out.push({k, sage, line, kind:T.kind, amt:+amt.toFixed(2), ref, desc:(vendor && !desc.includes(vendor) ? vendor + ': ' : '') + desc, date, cc});
  });
  return {out, skipped, unmatched};
}

function tripCalc(){
  const t = S.t, base = (S.settings.bases||{})[t.who] || '', rate = Number(S.settings.rate)||0;
  const jobs = t.stops.filter(Boolean); if (!jobs.length || !base) return null;
  const stops = ['Base', ...jobs, 'Base']; const legs = []; let manual = false, missing = false;
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i+1], charge = b !== 'Base' ? b : a, k = key(a,b) + '|' + i;
    let mi = a === 'Base' ? baseMiles(b, base) : b === 'Base' ? baseMiles(a, base) : legMiles(a, b);
    let src = 'table';
    if (mi == null) { const m = num(t.manual[k]); if (m != null) { mi = m; src = 'installer'; manual = true; } else missing = true; }
    legs.push({a, b, charge, mi, src, k, ext: 'MIL-' + initials(t.who) + '-' + t.date.replace(/-/g,'') + '-' + (i+1) + '-' + charge});
  }
  const mi = legs.reduce((s,l) => s + (l.mi||0), 0);
  return {base, legs, mi, amt: mi * rate, rate, manual, missing};
}

  if (a === 'addline') { const ln = $('#nl-line').value.trim(), bd = num($('#nl-budget').value); if (!ln) { S.err = 'Name the budget line.'; return render(); } await save('lines/' + docId(b.dataset.sage + '__' + ln), {sage:b.dataset.sage, line:ln, budget: bd ?? ''}); }
  if (a === 'review') { const r = wipRow(b.dataset.sage); await save('reviews/' + docId(curMonth() + '__' + r.sage), {sage:r.sage, month:curMonth(), by:S.me||'', at:new Date().toISOString(), note:($('#rv-note')||{}).value||'', est:+r.est.toFixed(2), pct:r.pct}, false); S.msg = r.sage + ' marked reviewed.'; }
  if (a === 'unreview') await del('reviews/' + docId(curMonth() + '__' + b.dataset.sage));
  if (a === 'lock') return lockClose();
  if (a === 'reopen') { const m = b.dataset.m; await save('config/settings', {openMonth: m}); await del('closes/' + m); S.msg = monthName(m) + ' is open again.'; }
  if (a === 'impgo') return commitImport();
  if (a === 'impcancel') S.imp = null;
  if (a === 'impdel') { await save('imports/' + b.dataset.id, {removed:true}); S.msg = 'Import removed; its rows are off the WIP schedule.'; }
  if (a === 'impundo') await save('imports/' + b.dataset.id, {removed:false});
  if (a === 'addcc') { const k = $('#cc-new').value.trim(), v = $('#cc-line').value.trim(); if (!k || !v) { S.err = 'Enter the cost code and budget line.'; return render(); } const m = Object.assign({}, S.settings.ccmap||{}); m[k] = v; await save('config/settings', {ccmap:m}); }
  if (a === 'wipxlsx') { const rows = wipIds().map(wipRow);
    const head = ['Sage job #','Innergy project','Job','Contract','Billed','Innergy costs','Sage-only costs','Mileage & parking','Cost to date','Cost to complete','Est. total cost','% complete','Earned','Over/(under) billed','Gross profit','Margin','Last close est.','Change','Flag','Reviewed by','Review note'];
    const sheet1 = [head, ...rows.map(r => [r.sage, r.proj, r.name, r.contract, r.billed, +r.inn.toFixed(2), +r.sg.toFixed(2), +(r.ml.m + r.ml.p).toFixed(2), +r.ctd.toFixed(2), +r.ctc.toFixed(2), +r.est.toFixed(2), r.pct, r.earned, r.over, r.gp, r.margin, r.last, r.chg, r.flags.join('; '), r.rv ? nameOf(r.rv.by) : '', r.rv ? r.rv.note || '' : ''])];
    const sheet2 = [['Sage job #','Budget line','Budget','Cost to date','Open POs','Budget left','Cost to complete','Crossed off','Note'], ...rows.flatMap(r => r.lines.map(l => [r.sage, l.line, l.budget, +l.ctd.toFixed(2), l.openpo, +l.left.toFixed(2), +l.ctc.toFixed(2), l.crossed ? 'Yes' : '', l.note]))];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheet1), 'WIP'); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheet2), 'Budget lines');
    return download('WIP schedule ' + curMonth() + '.xlsx', new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})])); }
  if (a === 'newjob') { const s = $('#nj-sage').value.trim(); if (!s) { S.err = 'Enter the Sage job #.'; return render(); }
    await save('jobs/' + docId(s), {sage:s, short: /^26\d{4}$/.test(s) ? s.slice(2) : '', proj:$('#nj-proj').value.trim(), alias:'', iname:$('#nj-name').value.trim(), tname:'', cos: num($('#nj-cos').value) ?? '', eng: num($('#nj-eng').value) ?? '', how:'Added by hand', status:'Added'}, false); S.msg = 'Job ' + s + ' added.'; }
  if (a === 'newleg') { const x = $('#nl-a').value.trim(), y = $('#nl-b').value.trim(), v = num($('#nl-mi').value); if (!x || !y || v == null) { S.err = 'Enter both job numbers and the miles.'; return render(); }
    await save('legs/' + docId(key(x,y)), {a:x, b:y, miles:v, note:'Added by hand'}, false); S.msg = 'Distance saved.'; }
  if (a === 'delleg') await del('legs/' + b.dataset.id);
  if (a === 'saverate') { const v = num($('#rate').value); if (v == null) { S.err = 'Enter the rate as a number, like 0.58.'; return render(); } await save('config/settings', {rate:v}); S.msg = 'Rate saved.'; }
  if (a === 'saveflags') { const c = num($('#lateCut').value), m = num($('#lateAmt').value), jp = num($('#jumpPts').value); if (c == null || m == null || jp == null) { S.err = 'Enter all three numbers.'; return render(); } await save('config/settings', {lateCut: c/100, lateAmt: m, jumpPts: jp}); S.msg = 'Flags saved.'; }
  render();
}
window.addEventListener('hashchange', () => { S.msg=''; S.err=''; render(); });
render(); initDb();
</script>
</body>
</html>
