<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Bid Screener <span style="font-size:.6em;vertical-align:middle;border:1px solid currentColor;border-radius:6px;padding:1px 6px">BETA</span></h1>
      <p>Beta for Sales and Estimating · not connected to email or Innergy yet · use “Suggest a change” to tell us what to fix</p>
      <div class="acct" id="acct"></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Screens"></nav>
  </div>

<main><div class="wrap" id="view"></div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(() => {
'use strict';
const TABS = [
  {id:'digest', label:'1. Today’s invites'},
  {id:'try', label:'2. Check an invite'},
  {id:'review', label:'3. Bid review'},
  {id:'estimates', label:'4. Past estimates'},
  {id:'ask', label:'5. Ask a question'},
  {id:'archive', label:'Archive', setup:true},
  {id:'gcs', label:'GC list', setup:true},
  {id:'criteria', label:'Rules', setup:true},
  {id:'score', label:'Accuracy', setup:true},
  {id:'feedback', label:'Suggestions', setup:true},
];
const STAGES = ['Awaiting bid review','Awaiting estimating capacity check','Back to Sales','Bidding (accepted)','Passed at review'];
const TIERS = ['Top','Mid','Low','Watch','Do Not Bid'];
const TRENDS = ['','Growing','Steady','Shrinking','Unknown'];
const DEFAULT_SETTINGS = {homeStates:['CO','WY','NE','KS','OK','NM','UT'], dueSoonDays:7,
  flags:{dueSoon:true,outOfArea:true,dd:true,hardBid:true,noLink:true,watch:true,check:true,award:true,sameProject:true,busy:true,smallScope:true,offPlatform:true,pastDue:true}, unlisted:'decline', busyDays:3, busyCount:4, smallScopeWords:['restroom','countertop','solid surface'],
  segments:[{name:'Large Healthcare',score:1},{name:'K-12 School',score:1},{name:'Office TI',score:1},{name:'Higher Ed',score:0.8},{name:'Hospitality',score:0.6},{name:'Luxury Living',score:0.4},{name:'Med Office Bldg',score:0.4},{name:'Entertainment',score:0.4},{name:'Government',score:0.2},{name:'Miscellaneous',score:0.2}],
  awardBasis:[{name:'Negotiated',score:1},{name:'Hard Bid',score:0},{name:"Don't Know",score:0.5}],
  bidTypes:[{name:'Award',score:1},{name:'Budget',score:0.4},{name:'RoM',score:0.5}]};

const S = {tab:'digest', gcs:new Map(), invites:new Map(), decisions:new Map(), feedback:new Map(), estimates:new Map(), estRows:new Map(), askLog:[], askBusy:false, askDraft:'', estUpload:null, estDel:null,
  settings:null, loaded:{gcs:false,invites:false}, db:null, user:null, me:null, sample:null,
  openId:null, fbOpen:false, gcQuery:'', gcTier:'All', showHandled:false, tryResult:null, tryBusy:false, tryErr:'', confirmClear:false, profiles:{}};
try { const t = localStorage.getItem('bss-tab'); if (TABS.some(x => x.id === t)) S.tab = t; } catch (e) {}
if (TABS.some(x => x.id === location.hash.slice(1))) S.tab = location.hash.slice(1);

const $ = (sel, root=document) => root.querySelector(sel);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const settings = () => Object.assign({}, DEFAULT_SETTINGS, S.settings || {}, {flags:Object.assign({}, DEFAULT_SETTINGS.flags, (S.settings||{}).flags||{})});
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = d => { if (!d || !/^\d{4}-\d{2}-\d{2}/.test(d)) return ''; return MONTHS[+d.slice(5,7)-1] + ' ' + (+d.slice(8,10)); };
const dayNum = d => Date.parse(d.slice(0,10) + 'T12:00:00Z') / 864e5;
const today = () => new Date().toISOString().slice(0,10);
const money = n => '$' + Math.round(n).toLocaleString('en-US');
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2400); }

/* ---------- GC matching: full names only, punctuation and endings ignored ---------- */
const ENDINGS = new Set(['inc','llc','co','company','companies','construction','constructors','corp','corporation','the','ltd','group','general','contractors','builders']);
function norm(s){
  const words = String(s||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/&/g,' and ').replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(Boolean);
  const out = []; let run = false;
  for (const w of words){ if (w.length === 1 && run) out[out.length-1] += w; else out.push(w); run = w.length === 1 || (run && w.length === 1); }
  while (out.length > 1 && ENDINGS.has(out[out.length-1])) out.pop();
  while (out.length > 1 && out[0] === 'the') out.shift();
  return out.join(' ');
}
function matchGC(inv){
  const target = norm(inv.gcText);
  const dom = String(inv.contactEmail||'').split('@')[1]?.toLowerCase() || '';
  for (const [id, g] of S.gcs){
    const names = [g.name, ...String(g.aka||'').split(';')].map(norm).filter(Boolean);
    if (target && names.includes(target)) return {id, g};
    if (dom && String(g.domains||'').toLowerCase().split(/[;,\s]+/).includes(dom)) return {id, g};
  }
  return null;
}
function screen(inv){
  const m = matchGC(inv); const tier = m ? (m.g.tier || 'No tier') : 'No match';
  let rec, why;
  if (inv.emailType && inv.emailType !== 'New invite'){ rec='not'; why = `${inv.emailType}, not a new invitation.`; }
  else if (!S.gcs.size){ rec='look'; why = 'Your GC list is empty, so there’s nothing to compare this GC to yet. Import your GC list on the “GC list” screen.'; }
  else if (tier === 'Top' || tier === 'Mid'){ rec='review'; why = `${m.g.name} is ${tier} tier, so every project goes to bid review.`; }
  else if (tier === 'Do Not Bid'){ rec='decline'; why = `${m.g.name} is on the Do Not Bid list.`; }
  else if (tier === 'Low'){ rec='look'; why = `${m.g.name} is Low tier: add only if scope and schedule align.`; }
  else if (tier === 'Watch'){ rec='look'; why = `${m.g.name} is on the Watch list.`; }
  else if (tier === 'No tier'){ rec='look'; why = `${m.g.name} is on the GC list without a tier.`; }
  else if (settings().unlisted === 'decline'){ rec='decline'; why = `“${inv.gcText || 'Unknown GC'}” is not on the GC list, and the Rules screen says to suggest declining GCs that aren’t listed.`; }
  else { rec='look'; why = `“${inv.gcText || 'Unknown GC'}” is not on the GC list.`; }
  return {rec, tier, gc:m, why, flags:flagsFor(inv, m, tier)};
}
function stateOf(loc){ const x = String(loc||'').match(/,\s*([A-Z]{2})\b(?:\s*\d{5})?/); return x ? x[1] : ''; }
function baseProject(p){ return norm(String(p||'').split(':')[0].replace(/^(bid invite|cd bid|invite to bid)\s*[-:]?\s*/i,'').replace(/invitation to bid.*$/i,'').replace(/\b(project|100% ?cds?|for award)\b.*$/i,'')); }
function flagsFor(inv, m, tier){
  const st = settings(), f = st.flags, out = [];
  if (f.watch && tier === 'Watch') out.push({t:'Watch list'});
  if (f.check && m && /\?\s*$/.test(m.g.check||'')) out.push({t:'Open question: ' + m.g.check, warn:true});
  if (f.dueSoon && inv.due && inv.received){ const d = dayNum(inv.due) - dayNum(inv.received); if (d >= 0 && d <= st.dueSoonDays) out.push({t:`Due within ${st.dueSoonDays} days`, warn:true}); }
  const s = stateOf(inv.location); if (f.outOfArea && s && !st.homeStates.includes(s)) out.push({t:'Out of area ('+s+')', warn:true});
  if (f.dd && /\bDD\b/.test(inv.stage || inv.project || '')) out.push({t:'DD set: pricing may be budget-level'});
  if (f.hardBid && inv.award === 'Hard Bid') out.push({t:'Hard bid (scores 0 on the calculator)'});
  if (f.noLink && !inv.hasRfpLink) out.push({t:'No RFP or plans link'});
  const text = [inv.project, inv.package, inv.description].join(' ');
  if (f.award && /for award|award round|\bgmp\b|final pricing|\brebid\b/i.test(text)) out.push({t:'Award round or final pricing'});
  if (f.offPlatform && inv.platform === 'Direct email') out.push({t:'Not on a bid platform: reply by email'});
  if (f.pastDue && inv.due && inv.due < today()) out.push({t:'Bid date has passed'});
  if (f.smallScope){ const w = (st.smallScopeWords||[]).find(w => w && text.toLowerCase().includes(w.toLowerCase())); if (w) out.push({t:`Possible small scope (“${w}”)`, warn:true}); }
  if (f.sameProject && inv.id){ const base = baseProject(inv.project); for (const [oid, o] of S.invites){ if (oid === inv.id || !base || baseProject(o.project) !== base || (o.emailType && o.emailType !== 'New invite')) continue; const om = matchGC(o); out.push({t:`Same project also invited by ${om ? om.g.name + ' (' + (om.g.tier||'no tier') + ')' : o.gcText}`}); } }
  if (f.busy && inv.due && inv.id){ let n = 0; for (const [oid, o] of S.invites){ if (oid === inv.id || !o.due || (o.emailType && o.emailType !== 'New invite')) continue; const om = matchGC(o); const t = om ? om.g.tier : ''; if (!['Top','Mid','Low','Watch'].includes(t)) continue; if (Math.abs(dayNum(o.due) - dayNum(inv.due)) <= (st.busyDays||3)) n++; } if (n >= (st.busyCount||4)) out.push({t:`${n} other bids due within ${st.busyDays||3} days: check estimating capacity`}); }
  for (const x of (inv.extraFlags||[])) if (!out.some(o => o.t === x)) out.push({t:x, warn:/rebid/i.test(x)});
  return out;
}
const REC = {decline:{label:'We suggest declining', pill:'Suggest decline'}, review:{label:'We suggest bid review', pill:'Suggest bid review'}, look:{label:'You decide', pill:'You decide'}, not:{label:'Not a bid invite', pill:'Not an invite'}};
const DEC = {decline:'Declined', review:'Sent to bid review', look:'Left for later', not:'Marked not an invite'};
const declineLabel = p => ({SmartBid:'No, I Won’t Bid', BuildingConnected:'Not Bidding', Procore:'Will Not Bid'})[p] || 'Send decline';
const decisionRec = d => d === 'decline' ? 'decline' : d === 'review' ? 'review' : d === 'not' ? 'not' : 'look';

/* ---------- Size band from the calculator's ranges ---------- */
function sizeBand(v){
  if (!v) return {band:'Not stated', note:'No dollar value in the invite'};
  if (v >= 1e6) return {band:'Mega', note:'$1M and up'};
  if (v > 750e3) return {band:'Between Large and Mega', note:'The calculator has no band for $750K–$1M'};
  if (v >= 500e3) return {band:'Large', note:'$500K–$750K'};
  if (v >= 250e3) return {band:'Medium', note:'$250K–$500K'};
  if (v >= 100e3) return {band:'Small', note:'$100K–$250K'};
  return {band:'Mini', note:'Under $100K'};
}

function backtestRows(){

    else if (sc.rec === 'review'){ res='Match'; cls='ok'; }
    else { res='Match (left for a person)'; cls='ok'; }
    return {i, sc, o, res, cls};
  });
}

/* ---------- Read a saved .eml file into plain text ---------- */
function qpDecode(t){ return t.replace(/=\r?\n/g,'').replace(/=([0-9A-F]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16))); }
function utf8(bin){ try { return decodeURIComponent(escape(bin)); } catch(e){ return bin; } }
function htmlToText(h){ const d = new DOMParser().parseFromString(h,'text/html'); d.querySelectorAll('script,style').forEach(n=>n.remove()); d.querySelectorAll('br').forEach(n=>n.replaceWith('\n')); d.querySelectorAll('p,div,tr,li,h1,h2,h3,td').forEach(n=>n.append('\n')); return d.body ? d.body.textContent : h; }
function emlToText(raw){
  const head = raw.split(/\r?\n\r?\n/)[0]; const hdr = k => (head.match(new RegExp('^'+k+':\\s*([^\\r\\n]*(?:\\r?\\n[ \\t][^\\r\\n]*)*)','im'))||[])[1]||'';
  const parts = []; const walk = (chunk) => {
    const [h, ...rest] = chunk.split(/\r?\n\r?\n/); const body = rest.join('\n\n');
    const ct = (h.match(/^content-type:\s*([^;\r\n]+)/im)||[])[1]||'text/plain'; const bnd = (h.match(/boundary="?([^";\r\n]+)"?/i)||[])[1];
    if (/multipart/i.test(ct) && bnd){ body.split('--'+bnd).slice(1).forEach(p => { if (!p.startsWith('--')) walk(p.replace(/^\r?\n/,'')); }); return; }
    if (!/text\/(plain|html)/i.test(ct)) return;
    const enc = (h.match(/^content-transfer-encoding:\s*([^\s;]+)/im)||[])[1]||''; let txt = body;
    if (/base64/i.test(enc)){ try { txt = utf8(atob(body.replace(/\s+/g,''))); } catch(e){} } else if (/quoted/i.test(enc)) txt = utf8(qpDecode(body));
    parts.push({html:/html/i.test(ct), txt}); };
  walk(raw);
  const pick = parts.find(p => p.html) || parts[0]; let text = pick ? (pick.html ? htmlToText(pick.txt) : pick.txt) : raw;
  text = text.replace(/https?:\/\/\S+/g,'[link]').replace(/[ \t ‌]+/g,' ').replace(/\n\s*\n+/g,'\n').trim();
  return `From: ${hdr('From')}\nTo: ${hdr('To')}\nDate: ${hdr('Date')}\nSubject: ${hdr('Subject')}\n\n${text}`.slice(0,20000);
}

function catOf(name){
  const n = String(name||'').toLowerCase();
  if (/countertop|counter top|backsplash|splash/.test(n)) return 'Countertops';
  if (/window sill|\bsill\b/.test(n)) return 'Window sills';
  if (/panelsupport|panel support/.test(n)) return 'Hardware and accessories';
  if (/diewall|die wall/.test(n)) return 'Die walls';

  if (/cabinet|casework|locker|shelving/.test(n)) return 'Cabinets and casework';
  if (/cut & add|cut and add|release time|allowance|contingency|escalation/.test(n)) return 'Adjustments and allowances';
  if (/bracket|lock|grommet|release|support|\bbase\b|hinge|pull/.test(n)) return 'Hardware and accessories';
  return 'Other';
}
function codeOf(name){ const m = String(name||'').match(/^([A-Z]{1,3})-\d+/); return m ? m[0] : ''; }
function familyOf(name){ const m = String(name||'').match(/^([A-Z]{1,3})-\d+/); return m ? (FAMILY[m[1]] || m[1]) : ''; }
function roomTypeOf(loc){ return String(loc||'').replace(/^\s*\d+[A-Z]?\s+/,'').replace(/\s+/g,' ').trim(); }
function estRows(id){
  const out = [];
  for (const [cid, c] of S.estRows){ if (c.estimate === id && Array.isArray(c.rows)) out.push([c.k||0, c.rows]); }

function estList(){ return [...S.estimates.entries()].map(([id, e]) => ({id, ...e})).sort((a,b) => String(b.date||'').localeCompare(String(a.date||''))); }
function lines(filter){

    if (f.status && String(e.status||'').toLowerCase() !== String(f.status).toLowerCase()) continue;
    if (f.date_from && String(e.date||'') < String(f.date_from)) continue;

    for (const r of estRows(e.id)){
      const o = {}; EST_COLS.forEach((c, i) => o[c] = r[i]);

/* ---------- Read files: .eml, .txt, .pdf ---------- */
let pdfReady = null;
function loadPdfJs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfReady) return pdfReady;
  pdfReady = new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(window.pdfjsLib); } catch (e) { no(e); } };
    s.onerror = () => { pdfReady = null; no(new Error('The PDF reader didn’t load.')); }; document.head.append(s); });
  return pdfReady;
}
async function pdfToText(buf){
  const lib = await loadPdfJs(); const doc = await lib.getDocument({data:buf}).promise; const out = [];
  for (let p = 1; p <= Math.min(doc.numPages, 8); p++){ const pg = await doc.getPage(p); const tc = await pg.getTextContent(); let line = ''; let lastY = null;
    for (const it of tc.items){ const y = it.transform ? Math.round(it.transform[5]) : null; if (lastY !== null && y !== lastY){ out.push(line); line = ''; } line += it.str + (it.hasEOL ? '\n' : ' '); lastY = y; }
    out.push(line); }
  return out.join('\n').replace(/[ \t]+/g,' ').replace(/\n\s*\n+/g,'\n').trim().slice(0, 20000);
}
function readFileAs(file, how){ return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(r.error); how === 'buf' ? r.readAsArrayBuffer(file) : r.readAsText(file); }); }
async function fileToText(file){
  if (/\.pdf$/i.test(file.name) || file.type === 'application/pdf') return pdfToText(await readFileAs(file, 'buf'));
  const raw = String(await readFileAs(file, 'text'));
  if (/\.eml$/i.test(file.name) || /^(from|received|return-path|mime-version|delivered-to):/im.test(raw.slice(0, 2000))) return emlToText(raw);
  return raw.slice(0, 20000);
}

/* ---------- Import a GC list from a spreadsheet ---------- */
function normTier(v){
  const t = String(v||'').trim().toLowerCase().replace(/[^a-z ]/g,'');
  if (!t) return '';
  if (/^(do not bid|dnb|no bid|dont bid|do not)/.test(t)) return 'Do Not Bid';
  for (const x of ['Top','Mid','Low','Watch']) if (t.startsWith(x.toLowerCase())) return x;
  if (/^(high|a|tier 1|1)$/.test(t)) return 'Top';
  if (/^(medium|b|tier 2|2)$/.test(t)) return 'Mid';
  if (/^(c|tier 3|3)$/.test(t)) return 'Low';
  return null;
}
function parseGcSheet(aoa){
  const h = aoa.findIndex(r => r && r.some(c => /^(gc|gc name|name|general contractor|contractor|company)$/i.test(String(c||'').trim())));
  if (h < 0) throw new Error('Couldn’t find a column called “GC name”. Use the GC list template, or name the first column “GC name”.');
  const hdr = aoa[h].map(c => String(c||'').trim().toLowerCase());
  const col = re => hdr.findIndex(c => re.test(c));
  const ix = {name:col(/^(gc|gc name|name|general contractor|contractor|company)$/), tier:col(/tier|rank|status/), aka:col(/other name|aka|also|alias/), domains:col(/domain|email/), notes:col(/note/), why:col(/why|reason/), trend:col(/trend/)};
  const out = [], bad = [];
  for (const r of aoa.slice(h + 1)){
    if (!r) continue; const name = String(r[ix.name] ?? '').trim(); if (!name) continue;
    const rawTier = ix.tier >= 0 ? r[ix.tier] : ''; const tier = normTier(rawTier);
    if (tier === null) bad.push(`${name} (“${rawTier}”)`);
    const g = {name, tier: tier || ''};
    for (const k of ['aka','domains','notes','why']) if (ix[k] >= 0 && String(r[ix[k]] ?? '').trim()) g[k] = String(r[ix[k]]).trim();
    if (ix.trend >= 0 && TRENDS.includes(String(r[ix.trend] ?? '').trim())) g.trend = String(r[ix.trend]).trim();
    out.push(g);
  }
  if (!out.length) throw new Error('No GC names were found under the header row.');
  return {rows:out, bad};
}
async function readGcFile(file){
  S.gcImport = null; S.gcImportErr = '';
  try {
    let aoa;
    if (/\.csv$/i.test(file.name)){
      aoa = String(await readFileAs(file, 'text')).split(/\r?\n/).map(line => { const o = []; let cur = '', q = false; for (const ch of line){ if (ch === '"') q = !q; else if (ch === ',' && !q){ o.push(cur); cur = ''; } else cur += ch; } o.push(cur); return o; });
    } else {
      if (!window.XLSX) throw new Error('The spreadsheet reader didn’t load. Save the file as .csv and try again.');
      const wb = XLSX.read(new Uint8Array(await readFileAs(file, 'buf')), {type:'array'});
      aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:null});
    }
    const {rows, bad} = parseGcSheet(aoa);
    const byName = new Map([...S.gcs.entries()].map(([id, g]) => [norm(g.name), id]));
    const plan = rows.map(g => ({g, id: byName.get(norm(g.name)) || null}));
    S.gcImport = {file:file.name, plan, bad, added:plan.filter(p => !p.id).length, updated:plan.filter(p => p.id).length};
  } catch (e) { S.gcImportErr = e.message || 'That file couldn’t be read.'; }
  render(); showCard('gc-import');
}

        const doc = {name:g.name, aka:g.aka||'', domains:g.domains||'', tier:g.tier||'', why:g.why||'Imported from a spreadsheet', notes:g.notes||'', trend:g.trend||'', revisit:'', score:null, check:'', updatedBy:by(), updatedAt:now};

  else if (a === 'fbabout'){ S.fbScreen = S.tab === 'score' ? 'score' : 'digest'; S.fbDraft = `About “${t.dataset.p}”: `; S.fbOpen = true; renderOverlay(); $('#fb-text')?.focus(); }
  else if (a === 'fbclose'){ S.fbDraft = $('#fb-text')?.value || ''; S.fbOpen = false; renderOverlay(); }
  else if (a === 'asknew'){ S.askLog.length && (S.askLog[0].seen = true); const q = $('#ask-q'); if (q){ q.scrollIntoView({block:'center'}); q.focus(); } }
  else if (a === 'askstop'){ S.askCtl?.abort(); }
  else if (a === 'askrate'){ const x = S.askLog[+t.dataset.n]; if (!x || x.rated) return; x.rated = true; render(); write(() => S.db.collection('feedback').add({screen:'ask', text:`Ask: ${t.dataset.r}\nQ: ${x.q}\nA: ${x.a.slice(0,1500)}`, by:by(), at:new Date().toISOString(), done:false})); }
  else if (a === 'estcancel'){ S.estUpload = null; S.estErr = ''; const fi = $('#est-file'); if (fi) fi.value = ''; render(); }
  else if (a === 'estdel'){ S.estDel = t.dataset.id; render(); }
  else if (a === 'estdelno'){ S.estDel = null; render(); }
  else if (a === 'estdelyes') deleteEstimate(t.dataset.id);
  else if (a === 'copy'){ const el = document.getElementById(t.dataset.src); const txt = el ? el.textContent : ''; (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copied.'), () => { if (el){ el.hidden = false; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Selected. Press Ctrl+C or ⌘C to copy.'); }); }
});
$('#fab').addEventListener('click', () => { S.fbScreen = S.tab; S.fbOpen = !S.fbOpen; renderOverlay(); if (S.fbOpen) $('#fb-text')?.focus(); });
document.addEventListener('change', e => {
  const t = e.target; const a = t.dataset.act; if (!a) return;
  if (a === 'estfile'){ const f = t.files && t.files[0]; if (f) readEstimateFile(f); return; }
  if (a === 'estmeta'){ const e = S.estimates.get(t.dataset.id); if (e){ e[t.dataset.f] = t.value; write(() => S.db.doc('estimates/' + t.dataset.id).update({[t.dataset.f]:t.value}), 'Saved.'); } return; }
  if (a === 'emlfile'){ const f = t.files && t.files[0]; if (!f) return; fileToText(f).then(x => { S.tryDraft = x; S.tryErr = ''; render(); }, e => { S.tryErr = (e && e.message) || 'That file couldn’t be read.'; render(); showCard('try-card'); }); return; }
  if (a === 'bulkfiles'){ if (t.files && t.files.length) bulkInvites(t.files, t.dataset.where); return; }
  if (a === 'gcfile'){ const f = t.files && t.files[0]; if (f) readGcFile(f); return; }
  if (a === 'gcfield') gcField(t.dataset.id, t.dataset.f, t.value);
  else if (a === 'stage'){ const d = S.decisions.get(t.dataset.id); if (!d) return; d.stage = t.value; write(() => S.db.doc('decisions/' + t.dataset.id).update({stage:t.value}), 'Step updated.'); }
  else if (a === 'flag') saveSettings({flags:{[t.dataset.k]:t.checked}});
  else if (a === 'unlisted') saveSettings({unlisted:t.value});
  else if (a === 'smallwords') saveSettings({smallScopeWords:t.value.split(',').map(x => x.trim()).filter(Boolean)});
  else if (a === 'busycount') saveSettings({busyCount:Math.max(1, Math.min(20, +t.value || 4))});
  else if (a === 'busydays') saveSettings({busyDays:Math.max(1, Math.min(14, +t.value || 3))});
  else if (a === 'duedays') saveSettings({dueSoonDays:Math.max(1, Math.min(30, +t.value || 7))});
  else if (a === 'states') saveSettings({homeStates:t.value.toUpperCase().split(/[^A-Z]+/).filter(s => s.length === 2)});
  else if (a === 'fbdone'){ const f = S.feedback.get(t.dataset.id); if (f){ f.done = t.checked; write(() => S.db.doc('feedback/' + t.dataset.id).update({done:t.checked})); } }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.act === 'gcsearch'){ S.gcQuery = t.value; render(); }
  else if (t.dataset.act === 'gcfield' && t.type === 'text') gcField(t.dataset.id, t.dataset.f, t.value);
  else if (t.dataset.act === 'archsearch'){ S.archQuery = t.value; render(); }
  else if (t.id === 'try-text') S.tryDraft = t.value;
  else if (t.id === 'ask-q') S.askDraft = t.value;
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target;
  if (f.dataset.act === 'askform'){ ask($('#ask-q').value); return; }
  if (f.dataset.act === 'estsave'){ saveEstimate(); return; }
  if (f.dataset.act === 'addgc'){
    const name = $('#gc-new-name').value.trim(); if (!name) return; const tier = $('#gc-new-tier').value;
    let id = slug(name); if (S.gcs.has(id)) { toast(name + ' is already on the GC list.'); return; }
    const g = {name, aka:'', domains:'', tier, why:'Added in the sandbox', notes:'', trend:'', revisit:'', score:null, check:'', updatedBy:by(), updatedAt:new Date().toISOString()};
    S.gcs.set(id, g); S.gcQuery = ''; render(); write(() => S.db.doc('gcs/' + id).set(g), name + ' added as ' + tier + '.');
  } else if (f.dataset.act === 'fbsave'){
    const text = $('#fb-text').value.trim(); if (!text) return;
    const item = {screen:$('#fb-screen').value, text, by:by(), at:new Date().toISOString(), done:false};
    S.fbOpen = false; S.fbDraft = ''; renderOverlay();
    write(() => S.db.collection('feedback').add(item), 'Saved. Thank you.');
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (S.fbOpen){ S.fbOpen = false; renderOverlay(); } else if (S.openId){ S.openId = null; renderOverlay(); } } });

/* ---------- Boot: connect to Microsoft 365 (or demo mode), then listen for data ---------- */
function renderAcct(){
  const el = $('#acct'); const c = S.conn; if (!el) return;
  if (!c) { el.innerHTML = ''; return; }
  if (c.mode === 'demo') el.innerHTML = '<span class="chip sample">DEMO MODE</span><span>Made-up examples, saved only in this browser.</span><button class="btn ghost" type="button" data-act="resetdemo">Reset examples</button>';
  else if (!c.signedIn) el.innerHTML = '<button class="btn primary" type="button" data-act="signin">Sign in with Microsoft 365</button>';
  else el.innerHTML = `<span>Signed in as ${esc(c.account.name)}</span>${c.sample ? '' : '<span class="chip">Claude features off</span>'}<button class="btn ghost" type="button" data-act="signout">Sign out</button>`;
}
render();
(async () => {
  let c;
  try { c = await window.BS.connect(); }
  catch (e) { S.loadErr = (e && e.message) || 'Sign-in failed'; S.db = null; render(); return; }
  S.conn = c; S.mode = c.mode; renderAcct();
  if (!c.db){ S.needSignIn = true; S.db = null; render(); return; }
  S.db = c.db; S.user = c.user; S.sample = c.sample;
  try { S.me = await c.user.id(); } catch (e) {}
  const db = c.db;
  const failed = e => { S.loadErr = (e && e.message) || 'Unknown error'; render(); };
  const coll = (name, key, after) => db.collection(name).onSnapshot(snap => {
    const m = new Map(); for (const d of snap.docs) m.set(d.id, {...d.data()}); S[key] = m; if (after) after(); S.loadErr = ''; render();
  }, failed);
  coll('gcs', 'gcs', () => S.loaded.gcs = true);
  coll('invites', 'invites', () => S.loaded.invites = true);
  coll('decisions', 'decisions');
  coll('feedback', 'feedback');
  coll('estimates', 'estimates');
  coll('estrows', 'estRows');
  db.doc('settings/criteria').onSnapshot(d => { if (d.exists) S.settings = {...d.data()}; render(); }, () => {});
  if (c.start) c.start();
})();
})();
</script>
